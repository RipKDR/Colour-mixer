[package]
name = "chroma_engine"
version = "0.1.0"
edition = "2021"
description = "Spectral Kubelka-Munk pigment mixing engine for ChromaStudio"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
approx = "0.5"
