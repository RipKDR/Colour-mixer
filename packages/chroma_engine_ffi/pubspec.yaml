name: chroma_engine_ffi
description: FFI plugin for the ChromaStudio Rust spectral mixing engine
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  ffi: ^2.1.3

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
